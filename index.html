<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reefer Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reefer Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16324a">
<style>
/* Layout: one-column deck tool. Sticky header with date + round, searchable reefer list, full-screen entry sheet. Big tap targets for gloves and sunlight. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#0f2233; --muted:#5a6b7a; --line:#d3dbe2;
  --accent:#e2591b; --accent-ink:#ffffff; --navy:#16324a;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --warn:#9a6a00; --warn-bg:#fff4cc; --alarm:#c62828; --alarm-bg:#fde7e7;
  --info-bg:#e6eef7;
  --font-ui:-apple-system,"SF Pro Text","Roboto Condensed","Roboto","Arial Narrow",system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1620; --surface:#14222f; --ink:#e7eef4; --muted:#93a4b3; --line:#26394a;
  --accent:#ff7a3d; --accent-ink:#1a0c04; --navy:#9cc3e6;
  --ok:#5ccf8d; --ok-bg:#12301f; --warn:#f2c14e; --warn-bg:#352a08; --alarm:#ff6b6b; --alarm-bg:#3a1414; --info-bg:#162a3c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620; --surface:#14222f; --ink:#e7eef4; --muted:#93a4b3; --line:#26394a;
  --accent:#ff7a3d; --accent-ink:#1a0c04; --navy:#9cc3e6;
  --ok:#5ccf8d; --ok-bg:#12301f; --warn:#f2c14e; --warn-bg:#352a08; --alarm:#ff6b6b; --alarm-bg:#3a1414; --info-bg:#162a3c;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0f2333}}
:root[data-theme="dark"] header.top{background:#0f2333}
:root:not([data-theme="dark"]) body::before{background:var(--navy)}
header.top .wrap{padding-block:10px;display:grid;gap:8px}
.row1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:15px}
.brand small{display:block;font-weight:500;letter-spacing:.02em;text-transform:none;opacity:.75;font-size:13px}
.count{font-family:var(--font-num);font-size:20px;font-weight:600;text-align:right}
.count small{display:block;font-family:var(--font-ui);font-size:12px;opacity:.75;font-weight:500}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px}
.slots button{border:0;background:transparent;color:#fff;padding:8px 0;border-radius:7px;font-family:var(--font-num);font-weight:600;font-size:16px}
.slots button[aria-pressed="true"]{background:#fff;color:#16324a}
.progress{height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main .wrap{padding-block:12px 120px;display:grid;gap:12px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--navy);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-family:var(--font-num);font-size:17px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px}
.item.done{border-left-color:var(--ok)}
.item.mark{border-left-color:var(--warn)}
.item.alarm{border-left-color:var(--alarm);background:var(--alarm-bg)}
.item .cn{font-family:var(--font-num);font-weight:600;font-size:17px;letter-spacing:.02em;min-width:0;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.item .vals{grid-row:1 / span 2;grid-column:2;text-align:right;font-family:var(--font-num);font-size:15px;line-height:1.3}
.item .vals .lbl{color:var(--muted);font-family:var(--font-ui);font-size:12px;margin-right:4px}
.item .vals .todo{color:var(--muted);font-family:var(--font-ui);font-size:14px}
.item .vals .devv{color:var(--alarm);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.tag.alarm{background:var(--alarm);color:#fff}
.tag.mark{background:var(--warn-bg);color:var(--warn)}
.tag.c{background:var(--info-bg);color:var(--navy)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 18px;display:grid;gap:10px;text-align:left}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--muted)}
.note{border-radius:10px;padding:10px 12px;font-size:15px}
.note.info{background:var(--info-bg)}
.note.warn{background:var(--warn-bg);color:var(--ink)}
.note.alarm{background:var(--alarm-bg);color:var(--ink)}
.note.ok{background:var(--ok-bg)}
.note b{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:0 140px;display:grid;gap:14px}
.sheet-head{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-head .wrap{padding-block:10px;display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.sheet-title{flex:1;min-width:0}
.sheet-title .cn{font-family:var(--font-num);font-weight:600;font-size:19px}
.sheet-title .sub{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fact .v{font-family:var(--font-num);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.cam{display:grid;gap:8px}
.cam .btn.primary{min-height:64px;font-size:19px}
.pick{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}
.pick button.zoom{border-style:dashed}
.pick button.zoom[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.pick button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;background:#000}
.stage canvas{display:block;width:100%;height:auto;pointer-events:none}
.selbox{position:absolute;border:3px solid var(--accent);background:rgba(226,89,27,.15);border-radius:4px;pointer-events:none}
.hint{font-weight:700;font-size:16px;padding:8px 10px;background:var(--info-bg);border-radius:10px}
.photo{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.photo img{display:block;width:100%;max-height:260px;object-fit:contain;background:#000}
.photo .status{position:absolute;left:8px;bottom:8px;right:8px;background:rgba(10,20,30,.82);color:#fff;border-radius:8px;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}.progress i{transition:none}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inp{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.inp.auto{border-color:var(--navy)}
.inp button{border:0;background:var(--info-bg);width:46px;font-family:var(--font-num);font-size:22px;font-weight:600;flex:none}
.inp input{border:0;background:transparent;min-width:0;width:100%;padding:10px 8px;font-family:var(--font-num);font-size:28px;font-weight:600;text-align:right}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--accent)}
.inp .u{display:flex;align-items:center;padding-right:10px;color:var(--muted);font-family:var(--font-num);font-size:16px}
.unit{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:700;font-family:var(--font-num)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flag{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.flag svg{width:22px;height:22px}
.flag.alarm[aria-pressed="true"]{background:var(--alarm);border-color:var(--alarm);color:#fff}
.flag.mark[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.panel.alarm{border-color:var(--alarm)}
.panel.mark{border-color:var(--warn)}
.panel label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.txt{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
textarea.txt{min-height:70px;resize:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-family:var(--font-num);font-size:14px}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-foot .wrap{padding-block:10px;display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.sheet-foot .btn{min-height:56px;font-size:17px}
.history{font-size:14px;color:var(--muted);display:grid;gap:2px}
.history .num{color:var(--ink)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h3{margin:4px 0 0;font-size:17px}
.foot-note{color:var(--muted);font-size:13px}
@media (max-width:340px){.fields{grid-template-columns:1fr}}
/* v2: compact entry card, settings rows, collapsible blocks */
.sheet>.wrap{padding-block:8px 100px;gap:10px}
.sheet-head .wrap{padding-block:8px}
.factline{display:flex;gap:6px;flex-wrap:wrap}
.sphero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.sphero .factline{flex-direction:column;justify-content:space-between;flex-wrap:nowrap}
.spbox{display:flex;flex-direction:column;justify-content:center;border:3px solid var(--navy);background:var(--info-bg);border-radius:12px;padding:4px 12px;min-width:0}
.spbox .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.spbox .v{font-family:var(--font-num);font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap}
.spbox.frozen{border-color:#1e6fd9;background:#e3efff}
:root[data-theme="dark"] .spbox.frozen{background:#10243f;border-color:#5aa2ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spbox.frozen{background:#10243f;border-color:#5aa2ff}}
.item .spb{font-family:var(--font-num);font-weight:800;color:var(--ink);background:var(--info-bg);border:1px solid var(--navy);border-radius:6px;padding:0 6px;font-size:15px}
.item .spb.frozen{border-color:#1e6fd9}
.factline>span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:var(--font-num);font-size:15px;font-weight:600;white-space:nowrap}
.factline .k{color:var(--muted);font-family:var(--font-ui);font-size:12px;font-weight:600;margin-right:5px;text-transform:uppercase;letter-spacing:.04em}
.cam .btn.primary{min-height:52px;font-size:17px}
.inp input{font-size:26px;padding:8px}
.flag{min-height:46px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.more>summary{list-style:none;padding:11px 12px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:space-between;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";color:var(--muted)}
details.more[open]>summary::after{content:"▴"}
details.more>summary .sm{flex:1;min-width:0;text-align:right;color:var(--muted);font-weight:500;font-size:14px;font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.more .body{padding:0 12px 12px;display:grid;gap:8px}
.plugrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.plugrow label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.plugrow .txt{min-height:44px;padding:8px 10px}
.plugrow .btn{min-height:44px}
.history{font-size:14px;line-height:1.4;display:block;color:var(--muted)}
.sheet-foot .wrap{grid-template-columns:1fr}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-columns:none}
.seg button{padding:8px 12px;font-family:var(--font-ui)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.setrow>span{font-weight:700}
.offbox{display:grid;gap:12px}
.toolbar .btn{min-height:52px}
.lock{display:flex;gap:8px}
.lock .txt{flex:1;min-width:0}
</style>

</head><body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand">Reefer Log<small id="hdrSub"></small></div>
      <div class="count" id="hdrCount">0/0</div>
    </div>
    <div class="slots" role="group" data-i18n-aria="round">
      <button type="button" data-slot="0600" aria-pressed="true">06:00</button>
      <button type="button" data-slot="1400" aria-pressed="false">14:00</button>
      <button type="button" data-slot="2200" aria-pressed="false">22:00</button>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </div>
</header>

<main>
  <div class="wrap">
    <input type="file" id="fileImport" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <div id="banner"></div>
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
      <button class="iconbtn" type="button" id="btnSettings" data-i18n-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="chips" role="group">
      <button class="chip" type="button" data-f="todo" aria-pressed="true" data-i18n="fNot">Не отмечены</button>
      <button class="chip" type="button" data-f="done" aria-pressed="false" data-i18n="fDone">Отмечены</button>
      <button class="chip" type="button" data-f="flag" aria-pressed="false" data-i18n="fAlarm">Алармы</button>
      <button class="chip" type="button" data-f="dev" aria-pressed="false" data-i18n="fDev">Отклонения</button>
      <button class="chip" type="button" data-f="all" aria-pressed="false" data-i18n="fAll">Все</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</main>

<!-- entry sheet -->
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="shCn">
  <div class="sheet-head"><div class="wrap">
    <button class="iconbtn" type="button" id="shBack" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="sheet-title"><div class="cn" id="shCn"></div><div class="sub" id="shSub"></div></div>
  </div></div>
  <div class="wrap">
    <div class="sphero">
      <div class="spbox" id="spBox"><span class="k">Set point</span><span class="v" id="shSp"></span></div>
      <div class="factline">
        <span><span class="k" data-i18n="pos">Поз.</span><span id="shLoc"></span></span>
        <span><span class="k" data-i18n="round">Обход</span><span id="shSlot"></span></span>
      </div>
    </div>
    <div class="cam" id="camBlock">

const c2f=c=>r1(c*9/5+32);

const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};

/* ---------- helpers ---------- */
function parseTemp(txt,defUnit){
  if(txt==null)return null;
  const s=String(txt).replace(",",".").trim();
  const m=s.match(/([+\-−]?\s*\d+(?:\.\d+)?)\s*°?\s*([CF])?/i);
  if(!m)return null;
  const v=parseFloat(m[1].replace(/\s|−/g,x=>x==="−"?"-":""));
  if(isNaN(v))return null;
  return{v,unit:(m[2]||defUnit||"F").toUpperCase()};
}
function spF(r){if(!r.sp)return null;return r.sp.unit==="C"?c2f(r.sp.v):r.sp.v}
function fmtSp(x){return Number.isInteger(x)?String(x):x.toFixed(1)}
function spText(r){if(!r.sp)return r.spRaw||"—";const f=spF(r);return P.unit==="C"?`${fmtSp(f2c(f))} °C`:`${fmtSp(f)} °F`}
// supply minus set point (°F) for a round, only when it is beyond the tolerance from settings
function devOf(r,slot){const x=reading(r,slot),sp=spF(r);if(!x||x.sup==null||sp==null)return null;const d=r1(x.sup-sp),tol=parseFloat(S.meta.tol)||3;return Math.abs(d)>tol?d:null}
function tolText(){const tol=parseFloat(S.meta.tol)||3;return P.unit==="C"?fmt(r1(tol*5/9))+" °C":fmtSp(tol)+" °F"}
function isFrozen(r){const f=spF(r);return f!=null&&f<=14}
function reading(r,slot){return(r.readings&&r.readings[slot])||null}
function isDone(r,slot){const x=reading(r,slot);return!!(x&&(x.sup!=null||x.ret!=null))}
function cellText(cell){
  const v=cell.value;
  if(v==null)return"";
  if(v instanceof Date)return v.toISOString();
  if(typeof v==="object"){if(v.richText)return v.richText.map(x=>x.text).join("");if("result" in v)return v.result==null?"":String(v.result);if(v.text)return String(v.text);return cell.text||""}
  return String(v);
}
function cellRaw(cell){
  const v=cell.value;
  if(v==null)return null;
  if(v instanceof Date)return{d:v.toISOString()};
  if(typeof v==="object")return cellText(cell);
  return v;
}
function toast(msg,ms){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,ms||2600)}
function b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
const CN_RE=/^[A-Z]{4}\s*\d{3}\s*\d{3}\s*\d?$/i;

/* plug in / out stored in the SEABOARD columns K/L and AJ/AK */
function getDT(r,k){
  const e=r.extra||{},dv=e[PLUG[k].d],tv=e[PLUG[k].t];
  let date="";
  if(dv&&typeof dv==="object"&&dv.d)date=dv.d.slice(0,10);
  else if(typeof dv==="number"&&dv>20000){const d=new Date(Date.UTC(1899,11,30)+dv*864e5);date=d.toISOString().slice(0,10)}
  else if(typeof dv==="string"){let m=dv.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)date=m[0];else{m=dv.match(/(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?/);if(m){const y=m[3]?(m[3].length===2?"20"+m[3]:m[3]):(S.meta.date||todayISO()).slice(0,4);date=y+"-"+pad(m[2])+"-"+pad(m[1])}}}
  if(!date)return"";
  let time="00:00";
  if(tv&&typeof tv==="object"&&tv.d)time=tv.d.slice(11,16);
  else if(typeof tv==="number"&&tv<1){const mins=Math.round(tv*1440);time=pad(Math.floor(mins/60)%24)+":"+pad(mins%60)}
  else if(typeof tv==="number"){const h=Number.isInteger(tv)?Math.floor(tv/100):Math.floor(tv),mi=Number.isInteger(tv)?tv%100:Math.round((tv-Math.floor(tv))*100);if(h<24&&mi<60)time=pad(h)+":"+pad(mi)}
  else if(typeof tv==="string"){let m=tv.trim().match(/^(\d{1,2})(\d{2})$/)||tv.match(/(\d{1,2})[:.h](\d{2})/);if(m)time=pad(m[1])+":"+m[2]}
  return date+"T"+time;
}
function setDT(r,k,val){
  r.extra=r.extra||{};const c=PLUG[k];
  if(!val){delete r.extra[c.d];delete r.extra[c.t];return}
  // same style as the ship's files: date "dd.mm", time "HHMM"
  r.extra[c.d]=val.slice(8,10)+"."+val.slice(5,7);r.extra[c.t]=val.slice(11,13)+val.slice(14,16);
}
const dtShort=v=>v?v.slice(8,10)+"."+v.slice(5,7)+" "+v.slice(11,16):"";

/* ---------- import ---------- */
async function importFile(file){
  if(!window.ExcelJS){toast(t("noExcelLib"),4000);return}
  const wb=new ExcelJS.Workbook();
  try{await wb.xlsx.load(await file.arrayBuffer())}catch(e){toast(t("badFile"),4000);return}
  let found=null;
  for(const ws of wb.worksheets){
    for(let r=1;r<=Math.min(25,ws.rowCount);r++){
      const row=ws.getRow(r);let cCol=null;
      row.eachCell({includeEmpty:false},(cell,col)=>{if(cCol==null&&/CONTAINER|КОНТЕЙНЕР|CNTR/i.test(cellText(cell)))cCol=col});
      if(cCol){found={ws,hdr:r,cCol};break}
    }
    if(found)break;
  }
  if(!found){
    for(const ws of wb.worksheets){for(let r=1;r<=Math.min(60,ws.rowCount)&&!found;r++){ws.getRow(r).eachCell((cell,col)=>{if(!found&&CN_RE.test(cellText(cell).trim()))found={ws,hdr:r-1,cCol:col}})}if(found)break}
  }
  if(!found){toast(t("noCn"),4000);return}
  const {ws,hdr,cCol}=found;
  const isSeaboard=/CONTAINER/i.test(cellText(ws.getCell("B5")))&&/SUPPLY/i.test(cellText(ws.getCell("X6")));
  const out=[];let fileDate=null;const meta={};
  if(isSeaboard){
    const d=ws.getCell("D3").value; if(d instanceof Date)fileDate=d.toISOString().slice(0,10);
    meta.vessel=cellText(ws.getCell("C2")).trim();
    const voy=cellText(ws.getCell("B3")).match(/#\s*(.+)$/);meta.voyage=voy?voy[1].trim():"";
    meta.loadPort=cellText(ws.getCell("C4")).trim();
    meta.dischPort=cellText(ws.getCell("AL3")).trim();
    meta.mech=cellText(ws.getCell("AJ2")).trim();
    for(let r=7;r<=ws.rowCount;r++){
      const cn=cellText(ws.getCell("B"+r)).trim(); if(!cn)continue;
      const rf={id:"r"+r+"_"+Math.random().toString(36).slice(2,6),row:r,cn,loc:cellText(ws.getCell("C"+r)).trim(),spRaw:cellText(ws.getCell("D"+r)).trim(),extra:{},readings:{},remarks:cellText(ws.getCell("AI"+r)).trim(),alarm:null,mark:null};
      rf.sp=parseTemp(rf.spRaw,"F");
      for(const c of EXTRA_COLS){const v=cellRaw(ws.getCell(c+r));if(v!=null&&v!=="")rf.extra[c]=v}
      for(const k in SLOTS){
        const su=parseTemp(cellText(ws.getCell(SLOTS[k].sup+r)),rf.sp?rf.sp.unit:"F"),re=parseTemp(cellText(ws.getCell(SLOTS[k].ret+r)),rf.sp?rf.sp.unit:"F");
        if(su||re)rf.readings[k]={sup:su?(su.unit==="C"?c2f(su.v):su.v):null,ret:re?(re.unit==="C"?c2f(re.v):re.v):null,fromC:!!((su&&su.unit==="C")||(re&&re.unit==="C")),src:"file"};
      }
      const fill=ws.getCell("B"+r).fill;
      const argb=fill&&fill.fgColor&&fill.fgColor.argb||"";
      if(/FFFF00$/i.test(argb))rf.mark={text:"",fromFile:true};
      if(/^FF(FF9999|FF0000|FF7C80|FFC7CE)$/i.test(argb))rf.alarm={code:"",text:"",fromFile:true};
      out.push(rf);
    }
  }else{
    const hrow=ws.getRow(hdr);let lCol=null,sCol=null;
    hrow.eachCell((cell,col)=>{const x=cellText(cell);if(lCol==null&&/LOCATION|POSITION|POS\b|BAY|STOW|ПОЗИЦ/i.test(x))lCol=col;if(sCol==null&&/SET\s*-?\s*POINT|SETPOINT|SET TEMP|SET\b|TEMP|УСТАВК/i.test(x))sCol=col});
    for(let r=hdr+1;r<=ws.rowCount;r++){
      const cn=cellText(ws.getRow(r).getCell(cCol)).trim(); if(!cn||!/[A-Z]{3,4}/i.test(cn))continue;
      const spRaw=sCol?cellText(ws.getRow(r).getCell(sCol)).trim():"";
      out.push({id:"r"+r+"_"+Math.random().toString(36).slice(2,6),row:null,cn,loc:lCol?cellText(ws.getRow(r).getCell(lCol)).trim():"",spRaw,sp:parseTemp(spRaw,"F"),extra:{},readings:{},remarks:"",alarm:null,mark:null});
    }
  }
  if(!out.length){toast(t("emptyFile"),4000);return}
  const hasReadings=out.some(r=>Object.keys(r.readings).length);
  S.reefers=out;
  for(const k in meta)if(meta[k])S.meta[k]=meta[k];
  const prevDate=fileDate;
  S.meta.date=todayISO();
  persist();
  closeSettings(true);
  const cC=out.filter(r=>r.sp&&r.sp.unit==="C").length;
  let html=`<div class="note ok">${t("loaded",out.length,esc(file.name))}${cC?t("loadedC",cC):""}</div>`;
  if(hasReadings){
    html+=`<div class="note info" style="margin-top:8px">${t("hasReadings",prevDate?t("forD")+ddmm(prevDate):"")} <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="bnClear">${t("clearNew")}</button><button class="btn" type="button" id="bnKeep">${t("keep")}</button></div></div>`;
  }
  $("#banner").innerHTML=html;
  if(hasReadings){
    $("#bnClear").onclick=()=>{newDay();$("#banner").innerHTML=`<div class="note ok">${t("cleared",ddmm(S.meta.date))}</div>`};
    $("#bnKeep").onclick=()=>{if(prevDate){S.meta.date=prevDate;persist();renderAll()}$("#banner").innerHTML=""};
  }else setTimeout(()=>{if(/note ok/.test($("#banner").innerHTML))$("#banner").innerHTML=""},8000);
}
function newDay(){for(const r of S.reefers){r.readings={};r.alarm=null;r.mark=null;r.remarks=""}S.meta.date=todayISO();S.slot=defaultSlot();persist();renderAll()}

/* ---------- export (always °F) ---------- */
async function buildWorkbook(){
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(b64ToBuf(TEMPLATE_B64));
    const ws=wb.worksheets[0];
    const m=S.meta;
    const [y,mo,d]=m.date.split("-").map(Number);
    ws.getCell("D3").value=new Date(Date.UTC(y,mo-1,d));
    if(m.vessel)ws.getCell("C2").value=m.vessel;
    ws.getCell("B3").value="VOYAGE # "+(m.voyage||"");
    if(m.loadPort)ws.getCell("C4").value=m.loadPort;
    if(m.dischPort)ws.getCell("AL3").value=m.dischPort;
    if(m.mech)ws.getCell("AJ2").value=m.mech;
    let maxRow=6;for(const r of S.reefers)if(r.row)maxRow=Math.max(maxRow,r.row);
    let next=maxRow+1;const used=new Set();
    const RED={type:"pattern",pattern:"solid",fgColor:{argb:"FFFF9999"}},YEL={type:"pattern",pattern:"solid",fgColor:{argb:"FFFFFF00"}};
    for(const r of S.reefers){
      let row=r.row&&!used.has(r.row)?r.row:next++;used.add(row);
      ws.getCell("B"+row).value=r.cn;
      ws.getCell("C"+row).value=r.loc||null;
      if(r.sp){ws.getCell("D"+row).value=r.sp.unit==="C"?fmtSp(spF(r))+" F":(r.spRaw&&/F/i.test(r.spRaw)?r.spRaw:fmtSp(r.sp.v)+" F")}
      else ws.getCell("D"+row).value=r.spRaw||null;
      for(const c in r.extra){const v=r.extra[c];ws.getCell(c+row).value=(v&&typeof v==="object"&&v.d)?new Date(v.d):v}
      for(const k in SLOTS){const x=reading(r,k);
        ws.getCell(SLOTS[k].sup+row).value=x&&x.sup!=null?fmt(x.sup):null;
        ws.getCell(SLOTS[k].ret+row).value=x&&x.ret!=null?fmt(x.ret):null;}
      const parts=[];
      if(r.alarm){parts.push(("ALARM "+(r.alarm.code||"")).trim()+(r.alarm.text?": "+r.alarm.text:""))}
      if(r.mark&&r.mark.text)parts.push(r.mark.text);
      if(r.remarks)parts.push(r.remarks);
      if(r.sp&&r.sp.unit==="C")parts.push(`SP ${fmtSp(r.sp.v)} C`);
      ws.getCell("AI"+row).value=parts.length?parts.join(" / "):null;
      const fill=r.alarm?RED:r.mark?YEL:null;
      if(fill)for(let c=1;c<=39;c++){const cell=ws.getRow(row).getCell(c);cell.style=Object.assign({},cell.style,{fill})}
      if(ws.getCell("A"+row).value==null)ws.getCell("A"+row).value=String(row-6);
    }
    const buf=await wb.xlsx.writeBuffer();
    return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function defaultName(){
  const m=S.meta;
  if(P.fileTpl)return P.fileTpl.split("{date}").join(m.date);
  const vessel=(m.vessel||"VESSEL").replace(/^MV\s+/i,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toUpperCase();
  return `SEABOARD-DAILY-REEFER-REPORT-${vessel}-${m.date}`;
}
function showExport(){

function readInputs(){

function renderConv(){

function commit(){

async function downscale(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=2000;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",0.9));
  }finally{URL.revokeObjectURL(url)}
}
let pickT="sup";

function readSelection(box){

  const sp=spF(cur);

  if(k==="sup")setPick("ret");

  $("#nCancel").onclick=()=>{$("#banner").innerHTML=""};
  $("#nOk").onclick=()=>{const cn=$("#nCn").value.trim().toUpperCase();if(!cn){toast(t("enterCn"));return}
    const r={id:"m"+Date.now().toString(36),row:null,cn,loc:$("#nLoc").value.trim(),spRaw:$("#nSp").value.trim(),sp:null,extra:{},readings:{},remarks:"",alarm:null,mark:null,manual:true};
    r.sp=parseTemp(r.spRaw,"F");S.reefers.push(r);persist();$("#banner").innerHTML="";renderAll();openSheet(r.id)};
}

/* ---------- wiring ---------- */
$("#btnImport").onclick=()=>$("#fileImport").click();
$("#fileImport").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importFile(f)};
$("#btnExport").onclick=showExport;
$("#btnAdd").onclick=addManual;
$("#btnSettings").onclick=openSettings;$("#setBack").onclick=()=>closeSettings();
$("#segUnit").onclick=e=>{const b=e.target.closest("button");if(!b)return;P.unit=b.dataset.v;savePrefs();renderSettings()};
$("#segLang").onclick=e=>{const b=e.target.closest("button");if(!b)return;P.lang=b.dataset.v;savePrefs();applyLang();renderSettings()};
$("#segTheme").onclick=e=>{const b=e.target.closest("button");if(!b)return;P.theme=b.dataset.v;savePrefs();applyTheme();renderSettings()};
$("#segScan").onclick=e=>{const b=e.target.closest("button");if(!b)return;P.scan=b.dataset.v==="1";savePrefs();applyPrefs();renderSettings()};
$("#q").oninput=renderList;
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));renderList()});
document.querySelectorAll(".slots button").forEach(b=>b.onclick=()=>{S.slot=b.dataset.slot;persist();renderAll()});
$("#list").onclick=e=>{const b=e.target.closest(".item");if(b)openSheet(b.dataset.id)};
$("#shBack").onclick=closeSheet;
$("#btnShot").onclick=()=>$("#fileShot").click();
$("#fileShot").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!cur)return;
  const blob=await downscale(f).catch(()=>null);if(!blob){toast(t("photoFail"));return}
  lastBlob=blob;const img=$("#photoImg");if(img.src)URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(blob);await img.decode().catch(()=>{});view=null;drawView();
  $("#photoBox").hidden=false;$("#ocrNote").innerHTML="";setPick("sup");$("#photoBox").scrollIntoView({block:"start",behavior:"smooth"});
};
["#inSup","#inRet"].forEach(id=>$(id).addEventListener("input",()=>{auto[id==="#inSup"?"sup":"ret"]=false;$(id==="#inSup"?"#boxSup":"#boxRet").classList.remove("auto");renderConv()}));
document.querySelectorAll("[data-neg]").forEach(b=>b.onclick=()=>{const el=$("#"+b.dataset.neg);let x=el.value.trim();el.value=x.startsWith("-")?x.slice(1):"-"+x;el.dispatchEvent(new Event("input"));el.focus()});
$("#btnAlarm").onclick=()=>{draft.alarm=draft.alarm?null:{code:"",text:""};renderSheet();if(draft.alarm)$("#alCode").focus()};
$("#btnMark").onclick=()=>{draft.mark=draft.mark?null:{text:""};renderSheet();if(draft.mark)$("#mkText").focus()};
$("#alQuick").innerHTML=["High pressure","Low pressure","Sensor fail","Power fail","Defrost","Temp out of range"].map(x=>`<button type="button">${x}</button>`).join("");
$("#alQuick").onclick=e=>{const b=e.target.closest("button");if(!b)return;const el=$("#alText");el.value=el.value?el.value+", "+b.textContent:b.textContent};
$("#rmText").addEventListener("input",renderSummaries);
["#plugIn","#plugOut"].forEach(id=>$(id).addEventListener("input",renderSummaries));
$("#plugInNow").onclick=()=>{$("#plugIn").value=nowLocal();renderSummaries()};
$("#plugOutNow").onclick=()=>{$("#plugOut").value=nowLocal();renderSummaries()};
$("#btnRecheck").onclick=()=>{const v=readInputs();if(v.sup==null&&v.ret==null||isNaN(v.sup)||isNaN(v.ret)){toast(t("recheckFirst"));return}
  const f=x=>x==null?"—":fmt(fromU(x));const tx=`${nowHM()} Sup ${f(v.sup)} / Ret ${f(v.ret)}`;const el=$("#rmText");el.value=el.value?el.value+" / "+tx:tx;renderSummaries();toast(t("recheckAdded"))};
$("#btnClear").onclick=()=>{$("#inSup").value="";$("#inRet").value="";auto={sup:false,ret:false};draft.fromC=false;draft.convC=null;renderSheet()};
// Save: back to the list with an empty search, ready for the next container's last digits
$("#btnSave").onclick=()=>{if(!commit())return;const all=S.reefers.every(r=>isDone(r,S.slot));closeSheet();toast(all?t("allDone",SLOTS[S.slot].label):t("saved"));const q=$("#q");q.value="";renderList();try{q.focus({preventScroll:true})}catch(e){q.focus()}window.scrollTo(0,0)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else if(!$("#settings").hidden)closeSettings()}});

loadPrefs();loadLocal();applyPrefs();renderAll();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
